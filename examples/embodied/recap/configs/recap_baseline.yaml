# RECAP — baseline profile (values from the published RECAP recipe).
#
# Reward / return / advantage follow the documented recipe values (see
# the RECAP training recipe):
#   reward   : step=-1, success terminal=0, failure terminal=-300
#   return   : gamma=1.0 (no discount)
#   advantage: N=10 lookahead, top-30% marked positive
#   CFG      : positive-only conditional, unconditional_prob=0.1
#
# The policy is conditioned on a positive/negative advantage prompt with no
# separate base-branch loss term (the base case is routed via unconditional_prob).

recap:
  mode: baseline

  reward:
    mode: baseline
    success_reward: 0.0
    failure_reward: -300.0
    step_reward: -1.0
    use_discount: false
    gamma: 1.0

  value:
    backend: mlp
    hidden_dim: 256
    num_layers: 2
    use_image: false
    distributional: false
    lr: 1.0e-4
    batch_size: 32
    epochs: 5
    device: cpu
    seed: 0

  advantage:
    mode: baseline
    horizon: 10
    use_discount: false
    gamma: 1.0
    positive_quantile: 0.3
    task_dependent: false

  condition:
    positive_suffix: "\nAdvantage: positive"
    negative_suffix: "\nAdvantage: negative"
    advantage_dropout_prob: 0.0
    positive_only_conditional: true
    unconditional_prob: 0.1

  policy:
    alpha: 1.0
    use_base_branch: false
    use_advantage_dropout: false
